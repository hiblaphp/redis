services:
  redis:
    image: redis/redis-stack-server:latest
    environment:
      REDIS_ARGS: "--requirepass root_password"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "root_password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis_cluster:
    image: redis:latest
    ports:
      - "7000:7000"
      - "7001:7001"
      - "7002:7002"
    entrypoint: ["bash", "-c"]
    command: >
      "
        mkdir -p /data/7000 /data/7001 /data/7002;
        
        redis-server --port 7000 --cluster-enabled yes --cluster-config-file nodes.conf --protected-mode no --requirepass root_password --masterauth root_password --cluster-announce-ip 127.0.0.1 --cluster-announce-port 7000 --dir /data/7000 &
        redis-server --port 7001 --cluster-enabled yes --cluster-config-file nodes.conf --protected-mode no --requirepass root_password --masterauth root_password --cluster-announce-ip 127.0.0.1 --cluster-announce-port 7001 --dir /data/7001 &
        redis-server --port 7002 --cluster-enabled yes --cluster-config-file nodes.conf --protected-mode no --requirepass root_password --masterauth root_password --cluster-announce-ip 127.0.0.1 --cluster-announce-port 7002 --dir /data/7002 &
        
        sleep 3;
        
        redis-cli -a root_password --cluster create 127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 --cluster-replicas 0 --cluster-yes;
        
        tail -f /dev/null
      "

  redis_ssl:
    image: redis/redis-stack-server:latest
    ports:
      - "6380:6379"
    volumes:
      - ./tests/Fixtures/ssl/ca.pem:/tmp/ssl/ca.pem:ro
      - ./tests/Fixtures/ssl/server-cert.pem:/tmp/ssl/server-cert.pem:ro
      - ./tests/Fixtures/ssl/server-key.pem:/tmp/ssl/server-key.pem:ro
    command: >
      bash -c "
      mkdir -p /tmp/redis-ssl &&
      cp /tmp/ssl/ca.pem /tmp/redis-ssl/ca.pem &&
      cp /tmp/ssl/server-cert.pem /tmp/redis-ssl/server-cert.pem &&
      cp /tmp/ssl/server-key.pem /tmp/redis-ssl/server-key.pem &&
      chmod 644 /tmp/redis-ssl/ca.pem &&
      chmod 644 /tmp/redis-ssl/server-cert.pem &&
      chmod 600 /tmp/redis-ssl/server-key.pem &&
      exec redis-server 
      --loadmodule /opt/redis-stack/lib/rejson.so
      --loadmodule /opt/redis-stack/lib/redisearch.so
      --loadmodule /opt/redis-stack/lib/redisbloom.so
      --requirepass root_password
      --tls-port 6379 
      --port 0 
      --tls-cert-file /tmp/redis-ssl/server-cert.pem 
      --tls-key-file /tmp/redis-ssl/server-key.pem 
      --tls-ca-cert-file /tmp/redis-ssl/ca.pem
      --tls-auth-clients no
      "
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cert", "/tmp/redis-ssl/server-cert.pem", "--key", "/tmp/redis-ssl/server-key.pem", "--cacert", "/tmp/redis-ssl/ca.pem", "-a", "root_password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5